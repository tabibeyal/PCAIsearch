<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .search-wrapper {
      width: 100%;
      max-width: 720px;
    }

    .search-box {
      position: relative;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 16px 56px 16px 18px;
      transition: border-color 0.15s;
    }

    .search-box:focus-within {
      border-color: #6b6b6b;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }

    .search-box textarea {
      width: 100%;
      min-height: 56px;
      max-height: 320px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #f0f0f0;
      font-size: 16px;
      line-height: 1.6;
      font-family: inherit;
      overflow-y: auto;
    }

    .search-box textarea::placeholder {
      color: #666;
    }

    .submit-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      color: #1a1a1a;
      transition: background 0.15s, opacity 0.15s;
    }

    .submit-btn:disabled {
      background: #3a3a3a;
      color: #666;
      cursor: default;
    }

    .submit-btn:not(:disabled):hover {
      background: #ffffff;
    }

    .submit-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="search-wrapper">
    <div class="search-box">
      <textarea
        id="query"
        placeholder="Ask the Pali Canon…"
        rows="1"
        oninput="autoResize(this); toggleBtn()"
        onkeydown="handleKey(event)"
      ></textarea>
      <button class="submit-btn" id="submitBtn" disabled onclick="submit()" title="Submit">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const ta = document.getElementById("query");
    const btn = document.getElementById("submitBtn");

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function toggleBtn() {
      btn.disabled = ta.value.trim() === "";
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!btn.disabled) submit();
      }
    }

    function submit() {
      const q = ta.value.trim();
      if (!q) return;
      console.log("Query:", q);
      // wire up your search call here
    }
  </script>
</body>
</html>
